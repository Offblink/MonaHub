# ============================================================
# MonaHub 业务参数（可提交到仓库：不含任何口令/机器相关路径）
# ============================================================
# 上传根目录。留空 = ${user.home}/SubmissionHub/upload（推荐，换机器零改动）；
# 需要放到别的盘时填绝对路径，例如 D:/data/monahub/upload
upload.root=

# 服务端校验：单文件上限（字节）与扩展名白名单（逗号分隔，小写）
upload.max-size=10485760
upload.allowed-ext=pdf,jpg,jpeg,png,doc,docx,zip

# 多文件并发落盘的线程池（与 applicationContext.xml 的 uploadExecutor 对应）
upload.pool.core=2
upload.pool.max=8
upload.pool.queue=32
