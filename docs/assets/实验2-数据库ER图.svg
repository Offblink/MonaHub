<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="er-monahub-title er-monahub-desc">
  <title id="er-monahub-title">MonaHub submission_hub 数据库 ER 图</title>
  <desc id="er-monahub-desc">实体关系图：sys_user 用户上传 file_info 文件，file_info 累积 download_log 下载日志，每条下载日志同时引用文件与下载人，三表之间均为一对多关系。</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Relationship lines (drawn first) -->
  <!-- 1. sys_user 1 — N file_info : UPLOAD -->
  <line x1="288" y1="200" x2="408" y2="200" stroke="#4f5d75" stroke-width="1"/>
  <!-- 2. file_info 1 — N download_log : DOWNLOAD -->
  <line x1="688" y1="200" x2="808" y2="200" stroke="#4f5d75" stroke-width="1"/>
  <!-- 3. sys_user 1 — N download_log : DOWNLOADER (routed below) -->
  <path d="M 168,320 V 452 Q 168,460 176,460 H 920 Q 928,460 928,452 V 300" fill="none" stroke="#4f5d75" stroke-width="1"/>

  <!-- Cardinality labels -->
  <rect x="296" y="192" width="12" height="12" rx="2" fill="#f5f5f5"/>
  <text x="302" y="202" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
  <rect x="384" y="192" width="16" height="12" rx="2" fill="#f5f5f5"/>
  <text x="392" y="202" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

  <rect x="696" y="192" width="12" height="12" rx="2" fill="#f5f5f5"/>
  <text x="702" y="202" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
  <rect x="784" y="192" width="16" height="12" rx="2" fill="#f5f5f5"/>
  <text x="792" y="202" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

  <rect x="162" y="336" width="12" height="12" rx="2" fill="#f5f5f5"/>
  <text x="168" y="346" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
  <rect x="922" y="312" width="12" height="12" rx="2" fill="#f5f5f5"/>
  <text x="928" y="322" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

  <!-- Relationship labels -->
  <rect x="324" y="176" width="48" height="14" rx="2" fill="#f5f5f5"/>
  <text x="348" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">UPLOAD</text>

  <rect x="720" y="176" width="56" height="14" rx="2" fill="#f5f5f5"/>
  <text x="748" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DOWNLOAD</text>

  <rect x="512" y="438" width="72" height="14" rx="2" fill="#f5f5f5"/>
  <text x="548" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DOWNLOADER</text>

  <!-- Entity: sys_user -->
  <rect x="48" y="140" width="240" height="180" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="48" y="140" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)"/>
  <rect x="48" y="172" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
  <line x1="48" y1="180" x2="288" y2="180" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
  <text x="64" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
  <text x="64" y="172" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">sys_user</text>
  <text x="272" y="172" fill="#7a8399" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">用户</text>
  <text x="64" y="200" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
  <text x="272" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">bigint</text>
  <text x="64" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">username</text>
  <text x="272" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar(50) · uk</text>
  <text x="64" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">password</text>
  <text x="272" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar(72) · BCrypt</text>
  <text x="64" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">salt</text>
  <text x="272" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar(32)</text>
  <text x="64" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">real_name</text>
  <text x="272" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar(50)</text>
  <text x="64" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">create_time</text>
  <text x="272" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">datetime</text>

  <!-- Entity: file_info (focal coral) -->
  <rect x="408" y="80" width="280" height="320" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="408" y="80" width="280" height="40" rx="6" fill="rgba(235,108,54,0.10)"/>
  <rect x="408" y="112" width="280" height="8" fill="rgba(235,108,54,0.10)"/>
  <line x1="408" y1="120" x2="688" y2="120" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
  <text x="424" y="96" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · CENTRAL</text>
  <text x="424" y="112" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">file_info</text>
  <text x="672" y="112" fill="#7a8399" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">文件元信息</text>
  <text x="424" y="140" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
  <text x="672" y="140" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">bigint</text>
  <text x="424" y="160" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">origin_name</text>
  <text x="672" y="160" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar(255)</text>
  <text x="424" y="180" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">store_name</text>
  <text x="672" y="180" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar(64)</text>
  <text x="424" y="200" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">file_path</text>
  <text x="672" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar(512)</text>
  <text x="424" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">ext</text>
  <text x="672" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar(16)</text>
  <text x="424" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">md5</text>
  <text x="672" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">char(32)</text>
  <text x="424" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">file_size</text>
  <text x="672" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">bigint</text>
  <text x="424" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">content_type</text>
  <text x="672" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar(128)</text>
  <text x="424" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ uploader_id</text>
  <text x="672" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">bigint · FK</text>
  <text x="424" y="320" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">create_time</text>
  <text x="672" y="320" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">datetime</text>
  <text x="424" y="340" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">status</text>
  <text x="672" y="340" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">tinyint 1/0</text>
  <text x="424" y="360" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">deleted</text>
  <text x="672" y="360" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">tinyint 0/1</text>
  <text x="424" y="380" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">download_count</text>
  <text x="672" y="380" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>

  <!-- Entity: download_log -->
  <rect x="808" y="140" width="240" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="808" y="140" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)"/>
  <rect x="808" y="172" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
  <line x1="808" y1="180" x2="1048" y2="180" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
  <text x="824" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
  <text x="824" y="172" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">download_log</text>
  <text x="1032" y="172" fill="#7a8399" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">下载日志</text>
  <text x="824" y="200" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
  <text x="1032" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">bigint</text>
  <text x="824" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ file_id</text>
  <text x="1032" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">bigint · FK</text>
  <text x="824" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ downloader_id</text>
  <text x="1032" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">bigint · FK</text>
  <text x="824" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">download_time</text>
  <text x="1032" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">datetime</text>
  <text x="824" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">ip</text>
  <text x="1032" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar(64)</text>

  <!-- Index footnote -->
  <text x="48" y="496" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">INDEXES · sys_user: uk_username (UNIQUE) · file_info: idx_uploader / idx_uploader_time / idx_uploader_md5 · download_log: idx_file</text>

  <!-- Legend -->
  <line x1="48" y1="520" x2="1072" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="48" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="48" y="546" width="14" height="10" rx="2" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
  <text x="68" y="554" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">核心表（关系枢纽）</text>

  <rect x="176" y="546" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="196" y="554" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">普通实体表</text>

  <text x="278" y="554" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">#</text>
  <text x="294" y="554" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">主键 PK</text>

  <text x="366" y="554" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">→</text>
  <text x="382" y="554" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">外键 FK</text>

  <text x="454" y="554" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
  <text x="494" y="554" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">基数 1:N</text>
</svg>
